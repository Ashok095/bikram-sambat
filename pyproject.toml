[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bikram-sambat"
dynamic = ["version"]
authors = [
  { name = "Ashok Dhakal", email = "info@ashokdhakal.com" },
]
description = "A comprehensive, modern, and easy-to-use Python library for the Bikram Sambat (BS) calendar system."
readme = "README.md"
requires-python = ">=3.8"

license = "MIT"
license-files = ["LICENSE"]


keywords = [
  "bikram-sambat",
  "bikram sambat",
  "BS date",
  "nepali-date",
  "nepali-datetime",
  "nepali calendar",
  "date conversion",
  "ad-bs conversion",
  "calendar",
  "datetime",
  "nepali",
  "date-time",
  "nepal",
  "ad",
  "bs",
  "date convertor",
  "date converter",
  "nepali date conversion",
  "python nepali date",
  "nepali-calendar",
  "bs-calendar",
  "patro",
  "nepali-patro",
  "python-bikram-sambat",
  "ad-to-bs",
  "bs-to-ad",
  "nepali-timezone",
  "asia-kathmandu",
  "nepali-time"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
    "Natural Language :: English",
    "Natural Language :: Nepali",
]
dependencies = [
    "pytz",
]

[project.urls]
Homepage = "https://github.com/ashok095/bikram-sambat"
Repository = "https://github.com/ashok095/bikram-sambat"
"Bug Tracker" = "https://github.com/ashok095/bikram-sambat/issues"
Documentation = "https://bikram-sambat.readthedocs.io"  # Optional, if you host docs

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

docs = [
  "sphinx",
  "sphinx-rtd-theme"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bikram_sambat*"]
exclude = ["bikram_sambat.data.__pycache__*"]

[tool.setuptools.dynamic]
version = { attr = "bikram_sambat.__version__" }